[project]
name = "f1model"
version = "0.1.0"
description = "Pre-race F1 podium probability model with a walk-forward backtest"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.1.0",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "shap>=0.45",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
